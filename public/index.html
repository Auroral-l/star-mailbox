<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>星空信箱 · 藏在星星里的爱</title>
<style>
  :root {
    --pink: #ff8fab;
    --pink-deep: #ff5d8f;
    --gold: #ffd166;
    --ink: #3a2a5a;
    --paper: #fff8f0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    color: #fff;
    background:
      radial-gradient(1200px 800px at 85% -10%, rgba(255, 141, 171, .35), transparent 60%),
      radial-gradient(1000px 700px at -10% 110%, rgba(120, 90, 220, .45), transparent 60%),
      linear-gradient(160deg, #120b2e 0%, #231345 55%, #3b1f5e 100%);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---------- 飘浮的背景小爱心与星星 ---------- */
  #sky { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .floater {
    position: absolute;
    bottom: -60px;
    font-size: 22px;
    opacity: .75;
    animation: rise linear infinite;
    will-change: transform;
  }
  @keyframes rise {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    8%   { opacity: .8; }
    92%  { opacity: .8; }
    100% { transform: translateY(-110vh) rotate(340deg); opacity: 0; }
  }

  /* ---------- 通用 ---------- */
  .wrap { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 18px 16px 40px; min-height: 100vh; display: none; flex-direction: column; }
  .view { display: none; animation: fade .45s ease; }
  .view.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 14px; }
  .backbtn {
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25);
    color: #fff; border-radius: 999px; padding: 8px 18px; font-size: 15px;
    cursor: pointer; backdrop-filter: blur(8px); transition: .2s;
  }
  .backbtn:active { transform: scale(.95); background: rgba(255,255,255,.28); }
  .homebtn {
    background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.2);
    color: #fff; border-radius: 999px; padding: 8px 16px; font-size: 15px;
    cursor: pointer; backdrop-filter: blur(8px); transition: .2s;
  }
  .homebtn:active { transform: scale(.95); }

  /* ---------- 首页 ---------- */
  #view-home { text-align: center; padding-top: 6vh; flex: 1; }
  .brand { font-size: 44px; letter-spacing: 2px; margin-bottom: 6px; text-shadow: 0 4px 24px rgba(255, 141, 171, .5); }
  .brand .small { font-size: 15px; display: block; margin-top: 8px; font-weight: normal; letter-spacing: 4px; opacity: .9; }
  .subtitle { color: rgba(255,255,255,.78); font-size: 16px; margin: 14px auto 34px; max-width: 320px; line-height: 1.7; }

  .doors { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
  .door {
    width: 240px; padding: 34px 16px 26px; border-radius: 26px; cursor: pointer;
    background: linear-gradient(165deg, rgba(255,255,255,.16), rgba(255,255,255,.05));
    border: 1px solid rgba(255,255,255,.28);
    backdrop-filter: blur(14px);
    box-shadow: 0 18px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .25s ease, box-shadow .25s ease;
    text-align: center;
  }
  .door:hover { transform: translateY(-6px) scale(1.02); box-shadow: 0 26px 54px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.3); }
  .door:active { transform: scale(.96); }
  .door .icon { font-size: 78px; line-height: 1; display: block; margin-bottom: 14px; }
  .door .name { font-size: 21px; font-weight: 600; margin-bottom: 8px; }
  .door .desc { font-size: 13.5px; color: rgba(255,255,255,.75); line-height: 1.6; }
  .door.heart .icon { filter: drop-shadow(0 6px 18px rgba(255, 93, 143, .6)); animation: beat 1.6s ease-in-out infinite; }
  .door.star .icon { filter: drop-shadow(0 6px 18px rgba(255, 209, 102, .6)); animation: twinkle 2.4s ease-in-out infinite; }
  @keyframes beat { 0%,100% { transform: scale(1);} 12% { transform: scale(1.12);} 24% { transform: scale(1);} 36% { transform: scale(1.1);} 48% { transform: scale(1);} }
  @keyframes twinkle { 0%,100% { transform: scale(1) rotate(-4deg); opacity:1;} 50% { transform: scale(1.14) rotate(5deg); opacity:.85;} }

  .homefoot { margin-top: auto; padding-top: 30px; font-size: 12px; color: rgba(255,255,255,.5); line-height: 1.9; }
  .homefoot b { color: rgba(255,255,255,.8); font-weight: 500; }

  /* ---------- 写信页 ---------- */
  .page-title { font-size: 24px; text-align: center; margin: 6px 0 4px; letter-spacing: 1px; }
  .page-title small { display:block; font-size: 13px; font-weight: normal; color: rgba(255,255,255,.65); margin-top: 6px; }

  .form {
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.2);
    border-radius: 22px; padding: 22px 18px; backdrop-filter: blur(12px);
    margin-top: 16px;
  }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: rgba(255,255,255,.75); margin-bottom: 7px; letter-spacing: 1px; }
  .field input, .field textarea {
    width: 100%; background: rgba(255,255,255,.95); border: none; border-radius: 12px;
    padding: 13px 14px; font-size: 16px; color: var(--ink); font-family: inherit;
    outline: none; box-shadow: inset 0 1px 3px rgba(0,0,0,.12);
  }
  .field textarea { min-height: 160px; resize: vertical; line-height: 1.7; }
  .field input:focus, .field textarea:focus { box-shadow: 0 0 0 3px rgba(255, 141, 171, .55); }

  .btn-send {
    display: block; width: 100%; padding: 15px; border: none; border-radius: 999px;
    font-size: 17px; font-weight: 600; letter-spacing: 4px; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #ff5d8f, #ff8fab);
    box-shadow: 0 12px 28px rgba(255, 93, 143, .45);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn-send:active { transform: scale(.97); }
  .btn-send:disabled { opacity: .6; cursor: wait; }

  .sent-note { text-align:center; font-size: 13px; color: rgba(255,255,255,.6); margin-top: 16px; }
  .sent-note a { color: var(--gold); text-decoration: none; font-weight: 600; }

  /* 最近的信 */
  .recent { margin-top: 24px; }
  .recent h3 { font-size: 15px; color: rgba(255,255,255,.8); margin-bottom: 10px; letter-spacing: 1px; }
  .recent-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16);
    border-radius: 14px; padding: 12px 14px; margin-bottom: 9px; cursor: pointer;
    transition: .2s;
  }
  .recent-item:active { transform: scale(.98); background: rgba(255,255,255,.13); }
  .recent-item .t { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .recent-item .m { font-size: 12px; color: rgba(255,255,255,.55); margin-top: 3px; }
  .recent-item .arrow { color: var(--gold); font-size: 18px; flex-shrink: 0; }
  .empty-tip { text-align:center; color: rgba(255,255,255,.5); font-size: 14px; padding: 30px 0; line-height: 2; }

  /* ---------- 读信页 ---------- */
  .letter-card {
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.2);
    border-radius: 18px; padding: 16px 18px; margin-bottom: 12px; cursor: pointer;
    backdrop-filter: blur(10px); transition: .2s;
  }
  .letter-card:active { transform: scale(.98); background: rgba(255,255,255,.14); }
  .letter-card .row1 { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .letter-card .t { font-size: 17px; font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .letter-card .date { font-size: 12px; color: rgba(255,255,255,.5); flex-shrink: 0; }
  .letter-card .row2 { margin-top: 8px; font-size: 13px; color: rgba(255,255,255,.68); }
  .letter-card .row2 .tag { color: var(--pink); }
  .letter-card .row3 { margin-top: 10px; font-size: 12.5px; color: var(--gold); }

  /* ---------- 信详情 ---------- */
  .paper {
    background: linear-gradient(180deg, #fffdf7, #fff6ea); color: var(--ink);
    border-radius: 20px; padding: 26px 22px; margin-top: 14px;
    box-shadow: 0 20px 44px rgba(0,0,0,.4); position: relative; overflow: hidden;
  }
  .paper::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px;
    background: linear-gradient(90deg, var(--pink), var(--gold), var(--pink));
  }
  .paper .to { font-size: 16px; font-weight: 600; }
  .paper .body { margin-top: 16px; font-size: 16px; line-height: 2; white-space: pre-wrap; word-break: break-word; }
  .paper .sig { margin-top: 20px; text-align: right; font-size: 15px; }
  .paper .time { margin-top: 6px; text-align: right; font-size: 12px; color: #a08a70; }

  .reply-sec { margin-top: 20px; }
  .reply-sec h3 { font-size: 15px; margin-bottom: 12px; color: rgba(255,255,255,.85); letter-spacing: 1px; }
  .bubble { margin-bottom: 10px; display: flex; }
  .bubble .av { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; margin-right: 10px;
    display: flex; align-items: center; justify-content: center; font-size: 17px;
    background: linear-gradient(135deg, rgba(255,209,102,.85), rgba(255,141,171,.85)); }
  .bubble .box { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18);
    border-radius: 14px 14px 14px 4px; padding: 10px 13px; max-width: 82%; }
  .bubble .box .nm { font-size: 12.5px; color: var(--gold); margin-bottom: 4px; }
  .bubble .box .tx { font-size: 14.5px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .bubble .box .tm { font-size: 11px; color: rgba(255,255,255,.4); margin-top: 5px; }
  .bubble .box .rp-to { font-size: 12px; color: rgba(255,255,255,.62); margin-bottom: 5px; }
  .bubble .box .rp-to b { color: var(--gold); font-weight: 600; }
  .bubble .box .quote {
    margin: 6px 0 7px; padding: 7px 10px; border-left: 3px solid rgba(255,209,102,.65);
    background: rgba(255,255,255,.06); border-radius: 8px;
    font-size: 12.5px; line-height: 1.55; color: rgba(255,255,255,.62);
    word-break: break-word;
  }
  .bubble .box .rp {
    display: inline-block; margin-top: 7px; font-size: 12px; color: var(--gold);
    cursor: pointer; opacity: .8; user-select: none;
  }
  .bubble .box .rp:active { opacity: 1; }
  .rep-target {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: rgba(255,209,102,.13); border: 1px solid rgba(255,209,102,.4);
    border-radius: 12px; padding: 9px 13px; font-size: 13px; color: var(--gold);
    margin-bottom: 12px;
  }
  .rep-target b { color: #fff; }
  .rep-target button {
    background: none; border: none; color: rgba(255,255,255,.65); font-size: 12.5px;
    cursor: pointer; padding: 2px 4px; font-family: inherit;
  }

  /* ---------- 个人主页 ---------- */
  .profile-entry {
    margin-top: 28px; display: inline-block; padding: 12px 28px; border-radius: 999px;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25);
    color: #fff; font-size: 14.5px; cursor: pointer; backdrop-filter: blur(8px);
    transition: .2s; font-family: inherit; letter-spacing: 1px;
  }
  .profile-entry:active { transform: scale(.95); background: rgba(255,255,255,.2); }

  .profile-card {
    margin-top: 20px; background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.2); border-radius: 22px;
    padding: 30px 22px; text-align: center; backdrop-filter: blur(12px);
  }
  .avatar-xl {
    width: 104px; height: 104px; border-radius: 50%; margin: 0 auto 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 52px; overflow: hidden;
    background: linear-gradient(135deg, rgba(255,209,102,.9), rgba(255,141,171,.9));
    box-shadow: 0 10px 28px rgba(0,0,0,.35), 0 0 0 4px rgba(255,255,255,.12);
  }
  .avatar-xl img { width: 100%; height: 100%; object-fit: cover; }
  .profile-card .pname { font-size: 22px; font-weight: 600; letter-spacing: 1px; }
  .profile-card .pbio { margin-top: 10px; font-size: 14px; color: rgba(255,255,255,.72); line-height: 1.7; white-space: pre-wrap; }
  .profile-card .pmeta { margin-top: 16px; font-size: 12px; color: rgba(255,255,255,.45); }
  .profile-card .pown { display: inline-block; margin-top: 8px; padding: 3px 12px; border-radius: 999px; font-size: 12px; color: var(--gold); background: rgba(255,209,102,.12); border: 1px solid rgba(255,209,102,.35); }
  .btn-edit {
    margin-top: 20px; padding: 12px 34px; border: none; border-radius: 999px;
    font-size: 15px; font-weight: 600; letter-spacing: 1px; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #ff5d8f, #ff8fab);
    box-shadow: 0 10px 24px rgba(255,93,143,.4); font-family: inherit;
  }
  .btn-edit:active { transform: scale(.97); }

  .avatar-preview {
    width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 12px;
    display: flex; align-items: center; justify-content: center; font-size: 42px; overflow: hidden;
    background: linear-gradient(135deg, rgba(255,209,102,.9), rgba(255,141,171,.9));
  }
  .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-picker { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 4px; }
  .avatar-picker span {
    width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 22px; cursor: pointer;
    background: rgba(255,255,255,.1); border: 2px solid transparent; transition: .15s;
  }
  .avatar-picker span.on { border-color: var(--gold); background: rgba(255,209,102,.18); }
  .upload-btn {
    display: inline-block; margin-top: 4px; padding: 9px 22px; border-radius: 999px;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25);
    color: #fff; font-size: 13.5px; cursor: pointer;
  }
  .upload-btn:active { transform: scale(.97); }

  .bubble .av.click { cursor: pointer; box-shadow: 0 0 0 2px rgba(255,209,102,.45); }
  .bubble .av img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .viewp { color: var(--gold); opacity: .8; font-size: 11.5px; text-decoration: none; margin-left: 3px; }
  .me-chip {
    display: flex; align-items: center; gap: 9px; margin-bottom: 12px;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18);
    border-radius: 999px; padding: 7px 14px 7px 7px; font-size: 13.5px;
    color: rgba(255,255,255,.85);
  }
  .me-chip .mav {
    width: 30px; height: 30px; border-radius: 50%; overflow: hidden; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
    background: linear-gradient(135deg, rgba(255,209,102,.85), rgba(255,141,171,.85));
  }
  .me-chip .mav img { width: 100%; height: 100%; object-fit: cover; }
  .me-chip b { color: var(--gold); }
  .me-chip a { color: var(--pink); text-decoration: none; margin-left: auto; font-size: 12.5px; }
  .me-tip { font-size: 12.5px; color: rgba(255,255,255,.55); line-height: 1.6; margin-bottom: 12px; }
  .me-tip a { color: var(--gold); text-decoration: none; }

  .reply-form { margin-top: 18px; }
  .reply-form label { display:block; font-size: 13px; color: rgba(255,255,255,.75); margin-bottom: 7px; letter-spacing: 1px; }
  .reply-form input, .reply-form textarea {
    width: 100%; background: rgba(255,255,255,.95); border: none; border-radius: 12px;
    padding: 12px 14px; font-size: 15px; color: var(--ink); font-family: inherit;
    outline: none; box-shadow: inset 0 1px 3px rgba(0,0,0,.12);
  }
  .reply-form textarea { min-height: 90px; resize: vertical; line-height: 1.7; margin-top: 10px; }
  .btn-reply {
    margin-top: 12px; width: 100%; padding: 13px; border: none; border-radius: 999px;
    font-size: 16px; font-weight: 600; letter-spacing: 3px; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #ffd166, #ff8fab);
    box-shadow: 0 10px 24px rgba(255, 209, 102, .35);
  }
  .btn-reply:active { transform: scale(.97); }

  /* ---------- 寄出成功动画 ---------- */
  .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(18,11,46,.86);
    display: none; align-items: center; justify-content: center; backdrop-filter: blur(6px); }
  .overlay.show { display: flex; animation: fade .3s ease; }
  .success-box { text-align: center; animation: pop .5s cubic-bezier(.2,1.4,.4,1); }
  .success-box .big { font-size: 90px; display: block; animation: beat 1.4s ease-in-out infinite; }
  .success-box .t1 { font-size: 24px; margin-top: 18px; letter-spacing: 2px; }
  .success-box .t2 { color: rgba(255,255,255,.7); font-size: 14px; margin-top: 10px; line-height: 1.8; }
  .success-box .ok {
    margin: 22px auto 0; padding: 13px 46px; border: none; border-radius: 999px; font-size: 16px;
    letter-spacing: 3px; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #ff5d8f, #ff8fab); box-shadow: 0 12px 28px rgba(255,93,143,.45);
  }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* ---------- 提示气泡 ---------- */
  .toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%);
    background: rgba(0,0,0,.8); color: #fff; padding: 12px 22px; border-radius: 999px;
    font-size: 14px; z-index: 60; opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-8px); }

  @media (max-width: 420px) {
    .doors { flex-direction: column; align-items: center; }
    .door { width: 100%; max-width: 300px; padding: 26px 16px 22px; }
    .brand { font-size: 36px; }
  }
</style>
</head>
<body>

<!-- 背景飘浮 -->
<div id="sky"></div>

<!-- ============ 首页 ============ -->
<div class="wrap" id="view-home" style="display:flex">
  <div class="view active" style="display:block; text-align:center; padding-top:6vh; flex:1">
    <h1 class="brand">❤️ 星空信箱
      <span class="small">STAR · MAILBOX</span>
    </h1>
    <p class="subtitle">把心里的话写成一封信，寄给星星。<br>那些没说出口的，都在这里。</p>

    <div class="doors">
      <div class="door heart" onclick="goWrite()">
        <span class="icon">💗</span>
        <div class="name">寄出一封信</div>
        <div class="desc">点开爱心，写一封新的信，<br>放进我们的信箱里</div>
      </div>
      <div class="door star" onclick="goRead()">
        <span class="icon">⭐</span>
        <div class="name">读信与回信</div>
        <div class="desc">点开星星，看看信箱里<br>收到了谁的信，还可以回复</div>
      </div>
    </div>

    <div>
      <button class="profile-entry" onclick="goProfile()">👤 我的主页</button>
    </div>

    <div class="homefoot">
      电脑地址：<b>http://localhost</b><br>
      手机地址（连同一个WiFi）：<b id="phoneUrl">http://…</b>
    </div>
  </div>
</div>

<!-- ============ 写信页 ============ -->
<div class="wrap" id="view-write">
  <div class="view active" style="display:block">
    <div class="topbar">
      <button class="backbtn" onclick="goHome()">← 返回</button>
      <button class="homebtn" onclick="goRead()">⭐ 去看信</button>
    </div>
    <div class="page-title">💌 写一封信
      <small>写下想说的话，寄给心里的人</small>
    </div>

    <div class="form">
      <div class="field">
        <label>收信人（给谁写的）</label>
        <input id="in-recipient" type="text" maxlength="40" placeholder="例如：亲爱的你">
      </div>
      <div class="field">
        <label>你的署名（谁写的）</label>
        <input id="in-sender" type="text" maxlength="40" placeholder="例如：永远爱你的人">
      </div>
      <div class="field">
        <label>标题</label>
        <input id="in-title" type="text" maxlength="80" placeholder="给这封信起个名字">
      </div>
      <div class="field">
        <label>信的内容</label>
        <textarea id="in-content" maxlength="20000" placeholder="把想说的话都写下来吧……"></textarea>
      </div>
      <button class="btn-send" id="btn-send" onclick="sendLetter()">💗 寄出这封信</button>
    </div>

    <div class="sent-note">共收到 <b id="count-note" style="color:var(--gold)">0</b> 封信 ·
      <a href="javascript:void(0)" onclick="goRead()">点这里去看看 ➜</a>
    </div>

    <div class="recent">
      <h3>🕊️ 最近的信</h3>
      <div id="recent-list"></div>
    </div>
  </div>
</div>

<!-- ============ 读信页 ============ -->
<div class="wrap" id="view-read">
  <div class="view active" style="display:block">
    <div class="topbar">
      <button class="backbtn" onclick="goHome()">← 返回</button>
      <button class="homebtn" onclick="goWrite()">💗 去写信</button>
    </div>
    <div class="page-title">⭐ 信箱里的信
      <small id="read-sub">静静看看，谁写了信</small>
    </div>
    <div id="letter-list" style="margin-top:16px"></div>
  </div>
</div>

<!-- ============ 信详情页 ============ -->
<div class="wrap" id="view-letter">
  <div class="view active" style="display:block">
    <div class="topbar">
      <button class="backbtn" id="letter-back" onclick="detailBack()">← 返回</button>
      <button class="homebtn" onclick="goHome()">🏠 首页</button>
    </div>
    <div id="letter-detail"></div>
  </div>
</div>

<!-- ============ 个人主页 ============ -->
<div class="wrap" id="view-profile">
  <div class="view active" style="display:block">
    <div class="topbar">
      <button class="backbtn" onclick="profileBack()">← 返回</button>
      <button class="homebtn" onclick="goHome()">🏠 首页</button>
    </div>
    <div id="profile-body"></div>
  </div>
</div>

<!-- ============ 寄出成功 ============ -->
<div class="overlay" id="success-overlay">
  <div class="success-box">
    <span class="big">💌</span>
    <div class="t1">信已寄出</div>
    <div class="t2">已经放进信箱里啦，<br>打开星星就可以看到</div>
    <button class="ok" onclick="closeSuccess()">好</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================== 工具 ================== */
const $ = (id) => document.getElementById(id);
let activeView = 'view-home';
function show(id) {
  activeView = id;
  document.querySelectorAll('.wrap').forEach(v => v.style.display = 'none');
  $(id).style.display = 'flex';
  if (id === 'view-home') document.querySelector('#view-home > .view').style.display = 'block';
}
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 2400);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ================== 背景飘浮 ================== */
(function () {
  const sky = $('sky');
  const chars = ['💖','💕','✨','⭐','💫','🌸','🌟'];
  for (let i = 0; i < 34; i++) {
    const s = document.createElement('span');
    s.className = 'floater';
    s.textContent = chars[i % chars.length];
    s.style.left = (Math.random() * 100) + '%';
    s.style.fontSize = (14 + Math.random() * 22) + 'px';
    s.style.animationDuration = (9 + Math.random() * 14) + 's';
    s.style.animationDelay = (-Math.random() * 20) + 's';
    s.style.opacity = (0.35 + Math.random() * 0.45);
    sky.appendChild(s);
  }
})();

/* ================== 页面切换 ================== */
function goHome() {
  show('view-home');
  loadInfo();
}
function goWrite() {
  show('view-write');
  loadRecent();
}
function goRead() {
  show('view-read');
  loadLetters();
}
let detailBackTarget = 'read';
function detailBack() {
  detailBackTarget === 'read' ? goRead() : goWrite();
}

/* ================== 数据加载 ================== */
let letters = [];
let profileMap = {};
function rememberProfiles(data) {
  profileMap = {};
  for (const p of (data.profiles || [])) profileMap[p.id] = p;
}

async function api(path, options) {
  const res = await fetch(path, options);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || '网络出错了');
  return data;
}

async function loadInfo() {
  try {
    const info = await api('/api/info');
    $('phoneUrl').textContent = 'http://' + info.lanIp + ':' + info.port;
  } catch (e) { /* 忽略 */ }
}

async function loadRecent() {
  try {
    const data = await api('/api/letters');
    letters = data.letters || [];
    rememberProfiles(data);
    $('count-note').textContent = letters.length;
    const box = $('recent-list');
    if (!letters.length) {
      box.innerHTML = '<div class="empty-tip">还没有信哦。<br>在上面写下第一封吧 💗</div>';
      return;
    }
    box.innerHTML = letters.slice(0, 8).map(l => `
      <div class="recent-item" onclick="openLetter(${l.id}, 'write')">
        <div style="min-width:0">
          <div class="t">${escapeHtml(l.title)}</div>
          <div class="m">${escapeHtml(l.recipient)} · ${l.createdAt} · 💬 ${l.replies.length}</div>
        </div>
        <div class="arrow">❯</div>
      </div>`).join('');
  } catch (e) { toast(e.message); }
}

async function loadLetters() {
  const box = $('letter-list');
  $('read-sub').textContent = '静静看看，谁写了信…';
  try {
    const data = await api('/api/letters');
    letters = data.letters || [];
    rememberProfiles(data);
    $('read-sub').textContent = '一共 ' + letters.length + ' 封信，都为你留着';
    if (!letters.length) {
      box.innerHTML = '<div class="empty-tip">信箱还是空的……<br>点开爱心，去写第一封信吧 💗</div>';
      return;
    }
    box.innerHTML = letters.map(l => `
      <div class="letter-card" onclick="openLetter(${l.id}, 'read')">
        <div class="row1">
          <div class="t">${escapeHtml(l.title)}</div>
          <div class="date">${escapeHtml(l.createdAt.slice(0, 16))}</div>
        </div>
        <div class="row2">
          <span class="tag">💗 给 ${escapeHtml(l.recipient)}</span>　·
          来自 ${escapeHtml(l.sender)}
        </div>
        <div class="row3">💬 ${l.replies.length} 条回复</div>
      </div>`).join('');
  } catch (e) {
    box.innerHTML = '<div class="empty-tip">加载失败：' + escapeHtml(e.message) + '<br>请稍后再试</div>';
  }
}

/* ================== 写信 ================== */
async function sendLetter() {
  const title = $('in-title').value.trim();
  const content = $('in-content').value.trim();
  const sender = $('in-sender').value.trim() || '匿名';
  const recipient = $('in-recipient').value.trim() || '亲爱的你';

  if (!title) return toast('请先给信起个标题');
  if (!content) return toast('请写下信的内容哦');

  const btn = $('btn-send');
  btn.disabled = true;
  btn.textContent = '正在寄出…';
  try {
    await api('/api/letters', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, content, sender, recipient })
    });
    $('in-title').value = '';
    $('in-content').value = '';
    $('success-overlay').classList.add('show');
    loadRecent();
  } catch (e) {
    toast(e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '💗 寄出这封信';
  }
}
function closeSuccess() {
  $('success-overlay').classList.remove('show');
}

/* ================== 信详情 ================== */
let currentLetter = null;
let replyTarget = null; // 正在回复的那条回复 { id, name }
let lastLetterId = null; // 用于"查看主页"后返回原信

async function openLetter(id, from) {
  detailBackTarget = from;
  replyTarget = null;
  lastLetterId = id;
  show('view-letter');
  const box = $('letter-detail');
  box.innerHTML = '<div class="empty-tip">正在打开信封…</div>';
  try {
    const [data] = await Promise.all([api('/api/letters'), loadMyProfile()]);
    rememberProfiles(data);
    const l = (data.letters || []).find(x => x.id === id);
    if (!l) { box.innerHTML = '<div class="empty-tip">这封信好像被风吹走了</div>'; return; }
    renderLetter(l);
  } catch (e) {
    box.innerHTML = '<div class="empty-tip">加载失败：' + escapeHtml(e.message) + '</div>';
  }
}

function renderLetter(l) {
  currentLetter = l;
  const box = $('letter-detail');
  const replies = (l.replies || []).map(r => {
    const p = r.profileId ? profileMap[r.profileId] : null;
    const av = p ? avatarHtml(p.avatar) : '💬';
    const nm = p ? p.name : r.name;
    const avAttrs = p
      ? ` class="av click" onclick="openProfileFromReply(${Number(p.id)}, ${Number(l.id)})" title="查看 ${escapeHtml(p.name)} 的主页"`
      : ' class="av"';
    const viewLink = p
      ? `<a href="javascript:void(0)" class="viewp" onclick="openProfileFromReply(${Number(p.id)}, ${Number(l.id)})">查看主页 ›</a>`
      : '';
    return `
    <div class="bubble">
      <div${avAttrs}>${av}</div>
      <div class="box">
        <div class="nm">${escapeHtml(nm)} · ${escapeHtml(r.createdAt)}${viewLink}</div>
        ${r.replyToName ? `<div class="rp-to">回复 <b>@${escapeHtml(r.replyToName)}</b></div>` : ''}
        ${r.quote ? `<div class="quote">${escapeHtml(r.quote)}</div>` : ''}
        <div class="tx">${escapeHtml(r.content)}</div>
        <span class="rp" onclick="startReplyTo(${Number(l.id)}, ${Number(r.id)})">↩ 回复 Ta</span>
      </div>
    </div>`;
  }).join('');

  box.innerHTML = `
    <div class="paper">
      <div class="to">亲爱的 ${escapeHtml(l.recipient)}，</div>
      <div class="body">${escapeHtml(l.content)}</div>
      <div class="sig">—— ${escapeHtml(l.sender)}</div>
      <div class="time">${escapeHtml(l.createdAt)}</div>
    </div>

    <div class="reply-sec">
      <h3>💬 回复（${l.replies.length}）</h3>
      ${replies || '<div class="empty-tip" style="padding:16px 0">还没有人回复这封信</div>'}
    </div>

    <div class="reply-form">
      <div id="rep-target" class="rep-target" style="display:none">
        <span>正在回复 <b id="rep-target-name"></b></span>
        <button type="button" onclick="cancelReplyTo()">取消</button>
      </div>
      ${myProfile ? `
      <div class="me-chip">
        <span class="mav">${avatarHtml(myProfile.avatar)}</span>
        <span>以 <b>${escapeHtml(myProfile.name)}</b> 的身份回复</span>
        <a href="javascript:void(0)" onclick="goProfile()">编辑</a>
      </div>` : `
      <div class="me-tip">💡 <a href="javascript:void(0)" onclick="goProfile()">设置个人主页</a>后，你的回复会显示名字和头像</div>
      <label>你的称呼</label>
      <input id="rep-name" type="text" maxlength="40" placeholder="署名，例如：陪你的人">
      `}
      <label style="margin-top:10px">回复内容</label>
      <textarea id="rep-content" maxlength="4000" placeholder="${replyTarget ? '回复 @' + escapeHtml(replyTarget.name) + '……' : '写下你想回复的话……'}"></textarea>
      <button class="btn-reply" onclick="sendReply(${Number(l.id)})">⭐ 送出回复</button>
    </div>`;

  // 如果是从某条回复点进来的，恢复"正在回复"提示
  if (replyTarget) {
    $('rep-target-name').textContent = '@' + replyTarget.name;
    $('rep-target').style.display = 'flex';
  }
}

function startReplyTo(letterId, replyId) {
  const target = currentLetter && currentLetter.id === letterId
    ? (currentLetter.replies || []).find(r => r.id === replyId) : null;
  if (!target) return;
  replyTarget = { id: target.id, name: target.name };
  $('rep-target-name').textContent = '@' + target.name;
  $('rep-target').style.display = 'flex';
  const input = $('rep-content');
  input.placeholder = '回复 @' + target.name + '……';
  input.scrollIntoView({ behavior: 'smooth', block: 'center' });
  input.focus();
}

function cancelReplyTo() {
  replyTarget = null;
  if ($('rep-target')) $('rep-target').style.display = 'none';
  if ($('rep-content')) $('rep-content').placeholder = '写下你想回复的话……';
}

async function sendReply(id) {
  const nameInput = $('rep-name');
  const name = myProfile ? myProfile.name
    : ((nameInput ? nameInput.value.trim() : '') || '匿名');
  const content = $('rep-content').value.trim();
  if (!content) return toast('请先写下回复内容');
  const body = { name, content };
  if (myProfile) body.profileId = myProfile.id;
  if (replyTarget) body.replyTo = replyTarget.id;
  try {
    await api('/api/letters/' + id + '/reply', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    toast(replyTarget ? '已回复 @' + replyTarget.name + ' 💖' : '回复成功 💖');
    replyTarget = null;
    const data = await api('/api/letters');
    rememberProfiles(data);
    const updated = (data.letters || []).find(x => x.id === id);
    if (updated) renderLetter(updated);
  } catch (e) {
    toast(e.message);
  }
}

/* ================== 个人主页 ================== */
const CRED_KEY = 'star-mailbox-profile';
let myCred = null;
try { myCred = JSON.parse(localStorage.getItem(CRED_KEY) || 'null'); } catch (e) { myCred = null; }
let myProfile = null;
let profileCache = null;
let draftAvatar = '💗';
let profileBackView = 'view-home';

function saveCred(cred) {
  myCred = cred;
  try {
    if (cred) localStorage.setItem(CRED_KEY, JSON.stringify(cred));
    else localStorage.removeItem(CRED_KEY);
  } catch (e) { /* 忽略 */ }
}

async function loadMyProfile() {
  if (!myCred || !myCred.id) { myProfile = null; return; }
  try {
    const data = await api('/api/profiles/' + myCred.id);
    myProfile = data.profile;
  } catch (e) {
    myProfile = null;
    if (/不存在/.test(e.message)) saveCred(null);
  }
}

function avatarHtml(avatar) {
  const a = avatar || '💗';
  if (typeof a === 'string' && a.indexOf('data:image/') === 0) {
    return '<img src="' + a + '" alt="头像">';
  }
  return escapeHtml(a);
}

function goProfile(id) {
  profileBackView = activeView;
  show('view-profile');
  $('profile-body').innerHTML = '<div class="empty-tip">正在打开主页…</div>';
  if (id) loadProfilePage(id);
  else loadProfilePage(myCred && myCred.id ? myCred.id : null);
}

function profileBack() {
  if (profileBackView === 'view-letter' && lastLetterId != null) {
    openLetter(lastLetterId, detailBackTarget);
  } else if (profileBackView === 'view-read') {
    goRead();
  } else if (profileBackView === 'view-write') {
    goWrite();
  } else {
    goHome();
  }
}

function openProfileFromReply(profileId, letterId) {
  lastLetterId = letterId;
  goProfile(profileId);
}

async function loadProfilePage(id) {
  if (!id) { renderProfileSetup(); return; }
  await loadMyProfile();
  try {
    const data = await api('/api/profiles/' + id);
    const own = !!(myCred && myCred.id === data.profile.id);
    if (own) myProfile = data.profile;
    renderProfileCard(data.profile, own);
  } catch (e) {
    if (myCred && myCred.id === id) saveCred(null);
    $('profile-body').innerHTML =
      '<div class="empty-tip">这个主页暂时打不开<br>' + escapeHtml(e.message) + '</div>';
  }
}

function renderProfileCard(profile, own) {
  profileCache = profile;
  $('profile-body').innerHTML = `
    <div class="profile-card">
      <div class="avatar-xl">${avatarHtml(profile.avatar)}</div>
      <div class="pname">${escapeHtml(profile.name)}</div>
      ${profile.bio ? `<div class="pbio">${escapeHtml(profile.bio)}</div>`
        : (own ? '<div class="pbio" style="opacity:.5">还没有写个性签名</div>' : '')}
      ${own ? '<div class="pown">这是你的主页</div>' : ''}
      <div class="pmeta">加入于 ${escapeHtml(profile.createdAt)}</div>
      ${own ? '<div><button class="btn-edit" onclick="renderProfileEdit()">✏️ 修改我的资料</button></div>' : ''}
    </div>`;
}

const AVATAR_EMOJIS = ['💗','💖','🌸','🌙','⭐','🐰','🐻','🦊','🍓','🌻','🎀','✨'];

function avatarPickerHtml() {
  return AVATAR_EMOJIS.map(e =>
    `<span class="${e === draftAvatar ? 'on' : ''}" onclick="pickEmoji(this, '${e}')">${e}</span>`
  ).join('');
}

function renderProfileSetup() {
  profileCache = null;
  draftAvatar = '💗';
  $('profile-body').innerHTML = `
    <div class="profile-card" style="text-align:left">
      <div style="text-align:center">
        <div style="font-size:18px;font-weight:600">👋 设置你的个人主页</div>
        <div style="font-size:13px;color:rgba(255,255,255,.6);margin-top:7px;line-height:1.8">
          设置好之后，你回复时会显示名字和头像，<br>别人点你的头像就能看到你的主页
        </div>
        <div class="avatar-preview" id="av-preview" style="margin-top:18px">${avatarHtml(draftAvatar)}</div>
        <label class="upload-btn">📷 上传照片
          <input type="file" accept="image/*" style="display:none" onchange="onAvatarFile(this)">
        </label>
      </div>
      <div class="field" style="margin-top:20px">
        <label>或者选一个表情头像</label>
        <div class="avatar-picker" id="av-picker">${avatarPickerHtml()}</div>
      </div>
      <div class="field">
        <label>我的名字</label>
        <input id="pf-name" type="text" maxlength="24" placeholder="例如：小月亮">
      </div>
      <div class="field">
        <label>个性签名（选填）</label>
        <input id="pf-bio" type="text" maxlength="60" placeholder="一句话介绍自己">
      </div>
      <button class="btn-edit" style="width:100%" onclick="saveProfile()">💗 创建我的主页</button>
      <div style="text-align:center;margin-top:14px">
        <a href="javascript:void(0)" style="color:rgba(255,255,255,.55);font-size:13px" onclick="profileBack()">先不设置，返回</a>
      </div>
    </div>`;
}

function renderProfileEdit() {
  if (!profileCache) return;
  draftAvatar = profileCache.avatar || '💗';
  $('profile-body').innerHTML = `
    <div class="profile-card" style="text-align:left">
      <div style="text-align:center">
        <div style="font-size:18px;font-weight:600">✏️ 修改我的资料</div>
        <div class="avatar-preview" id="av-preview" style="margin-top:18px">${avatarHtml(draftAvatar)}</div>
        <label class="upload-btn">📷 上传照片
          <input type="file" accept="image/*" style="display:none" onchange="onAvatarFile(this)">
        </label>
      </div>
      <div class="field" style="margin-top:20px">
        <label>或者选一个表情头像</label>
        <div class="avatar-picker" id="av-picker">${avatarPickerHtml()}</div>
      </div>
      <div class="field">
        <label>我的名字</label>
        <input id="pf-name" type="text" maxlength="24" value="${escapeHtml(profileCache.name)}" placeholder="别人看到的名字">
      </div>
      <div class="field">
        <label>个性签名（选填）</label>
        <input id="pf-bio" type="text" maxlength="60" value="${escapeHtml(profileCache.bio || '')}" placeholder="一句话介绍自己">
      </div>
      <button class="btn-edit" style="width:100%" onclick="saveProfile()">💾 保存</button>
      <div style="text-align:center;margin-top:14px">
        <a href="javascript:void(0)" style="color:rgba(255,255,255,.55);font-size:13px" onclick="cancelProfileEdit()">取消</a>
      </div>
    </div>`;
}

function pickEmoji(el, emoji) {
  draftAvatar = emoji;
  document.querySelectorAll('#av-picker span').forEach(s => s.classList.remove('on'));
  el.classList.add('on');
  $('av-preview').innerHTML = avatarHtml(draftAvatar);
}

function onAvatarFile(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  if (!/^image\//.test(file.type)) return toast('请选择一张图片');
  if (file.size > 20 * 1024 * 1024) return toast('图片太大了，换一张吧');
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const size = 180;
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      const scale = Math.max(size / img.width, size / img.height);
      const w = img.width * scale, h = img.height * scale;
      ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
      draftAvatar = canvas.toDataURL('image/jpeg', 0.86);
      $('av-preview').innerHTML = avatarHtml(draftAvatar);
      document.querySelectorAll('#av-picker span').forEach(s => s.classList.remove('on'));
    };
    img.onerror = () => toast('这张图片读不出来，换一张试试');
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function cancelProfileEdit() {
  if (profileCache) renderProfileCard(profileCache, !!(myCred && myCred.id === profileCache.id));
  else renderProfileSetup();
}

async function saveProfile() {
  const name = $('pf-name').value.trim();
  const bio = $('pf-bio').value.trim();
  if (!name) return toast('请先填写名字');
  const body = { name, bio, avatar: draftAvatar };
  const editingOwn = !!(myCred && myCred.id && (!profileCache || myCred.id === profileCache.id));
  try {
    let data;
    if (editingOwn) {
      data = await api('/api/profiles/' + myCred.id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...body, token: myCred.token })
      });
      toast('资料已更新 ✨');
    } else {
      data = await api('/api/profiles', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      saveCred({ id: data.profile.id, token: data.token });
      toast('主页创建成功 🎉');
    }
    myProfile = data.profile;
    profileCache = data.profile;
    renderProfileCard(data.profile, true);
  } catch (e) {
    toast(e.message);
  }
}

/* ================== 启动 ================== */
loadInfo();
loadRecent();
loadMyProfile();
</script>
</body>
</html>
